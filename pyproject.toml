[project]
name = "visiontrack-modern-human-tracking"
version = "0.1.0"
description = "Laptop-friendly multi-person human detection and tracking using YOLO and OpenCV."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
